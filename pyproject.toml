# Dependency manifest for discord-tools (uv-native, GitOps source of truth).
# Loaded by hermes from source (by path), never pip-installed as a distribution,
# so `package = false` — uv just manages the dev/runtime deps below, which the
# pod's bootstrap installs into the gateway's PYTHONPATH.
[project]
name = "discord-tools"
version = "0.3.0"
description = "Discord reading tools plus channel-scoped react, server emoji, and embed actions for Hermes Discord-facing agents."
requires-python = ">=3.13"
dependencies = [
  "discord.py>=2.4",                 # DiscordLiveFetcher / DiscordLiveActions — live I/O
  "hermes-plugin-kit",               # Decorated tools/hooks + lifecycle registration
]

[dependency-groups]
dev = [
  "pyyaml",                          # tests/test_hermes_contract.py manifest-parity check
]

[tool.uv]
package = false

[tool.uv.sources]
hermes-plugin-kit = { git = "https://github.com/offendingcommit/hermes-plugin-kit.git", rev = "ca9e1c9ad95c6414bd26c7579ca22e25b40ec9d1" }
